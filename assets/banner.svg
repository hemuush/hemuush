<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Hemant Sharma, GenAI and Agentic AI Engineer">
  <defs>
    <pattern id="ck" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#0A0A0A"/><rect width="8" height="8" fill="#1F6F55"/><rect x="8" y="8" width="8" height="8" fill="#1F6F55"/>
    </pattern>
    <pattern id="sg" width="40" height="20" patternUnits="userSpaceOnUse">
      <g fill="#090B0B" stroke="#3FA7C9" stroke-width="1" stroke-opacity=".5">
        <g id="w"><circle cx="20" cy="-10" r="20"/><circle cx="20" cy="-10" r="14" fill="none"/><circle cx="20" cy="-10" r="8" fill="none"/></g>
        <use href="#w" x="-20" y="10"/><use href="#w" x="20" y="10"/><use href="#w" x="0" y="20"/><use href="#w" x="-20" y="30"/><use href="#w" x="20" y="30"/>
      </g>
    </pattern>
    <clipPath id="c"><rect width="900" height="220" rx="12"/></clipPath>
    <style>
      .t{font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',Georgia,serif}
      .m{font-family:'SF Mono',Menlo,Consolas,monospace}
      .role{opacity:0;animation:cycle 12s infinite}.r2{animation-delay:3s}.r3{animation-delay:6s}.r4{animation-delay:9s}
      @keyframes cycle{0%{opacity:0}4%,22%{opacity:1}27%,100%{opacity:0}}
      .cut{stroke-dasharray:500;stroke-dashoffset:500;animation:cut 6s ease-in-out infinite}
      @keyframes cut{0%{stroke-dashoffset:500;opacity:1}25%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="220" fill="#090B0B"/>
    <rect width="900" height="8" fill="url(#ck)"/>
    <text class="t" x="880" y="215" text-anchor="end" font-size="250" font-weight="700" fill="#3FA7C9" opacity=".07">滅</text>
    <rect y="170" width="900" height="50" fill="url(#sg)" opacity=".55"/>
    <text class="t" x="56" y="86" font-size="48" font-weight="700" fill="#ECE9E1" letter-spacing="-1.5">Hemant Sharma</text>
    <g class="m" font-size="17" fill="#3FA7C9">
      <text class="role" x="58" y="124">GenAI &amp; Agentic AI Engineer</text>
      <text class="role r2" x="58" y="124">RAG pipelines on Azure</text>
      <text class="role r3" x="58" y="124">Multi-agent workflows &amp; MCP</text>
      <text class="role r4" x="58" y="124">Python · FastAPI · LangGraph</text>
    </g>
    <path class="cut" d="M600 190 C680 130 760 70 850 22" fill="none" stroke="#3FA7C9" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x=".5" y=".5" width="899" height="219" rx="11.5" fill="none" stroke="#1D2224"/>
</svg>
