<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Hemant Sharma, GenAI and Agentic AI Engineer">
  <defs><style>
    .t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'SF Mono',Menlo,Consolas,monospace}
    .role{opacity:0;animation:cycle 12s infinite}
    .r2{animation-delay:3s}.r3{animation-delay:6s}.r4{animation-delay:9s}
    @keyframes cycle{0%{opacity:0}4%,22%{opacity:1}27%,100%{opacity:0}}
    .cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  </style></defs>
  <rect width="900" height="200" rx="12" fill="#0B0B0C"/>
  <rect x=".5" y=".5" width="899" height="199" rx="11.5" fill="none" stroke="#222225"/>
  <text class="t" x="56" y="92" font-size="50" font-weight="600" fill="#EDEDED" letter-spacing="-1.8">Hemant Sharma</text>
  <g class="m" font-size="17" fill="#8B8B92">
    <text class="role" x="58" y="134">GenAI &amp; Agentic AI Engineer</text>
    <text class="role r2" x="58" y="134">RAG pipelines on Azure</text>
    <text class="role r3" x="58" y="134">Multi-agent workflows &amp; MCP</text>
    <text class="role r4" x="58" y="134">Python · FastAPI · LangGraph</text>
  </g>
  <text class="m cur" x="58" y="134" font-size="17" fill="#EDEDED" opacity="0"> </text>
  <text class="t" x="844" y="168" text-anchor="end" font-size="13" fill="#55555C" letter-spacing="1">Noida, India</text>
</svg>
